name: Hub docker public image

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a commit: a moving tag would let someone else decide
# what runs with the credentials that publish the production image.
jobs:
  check:
    name: Static analysis and acceptance suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:stable \
            --shell=bash --severity=style --exclude=SC2016 \
            wrapper.sh library/*.bash library/fortinet/*.bash

      - name: Report templates are valid JSON
        run: |
          find library/fortinet/template -name '*.json' -print0 |
            xargs -0 -I {} sh -c 'jq -e . "{}" > /dev/null || { echo "invalid JSON: {}"; exit 1; }'

      - name: Acceptance suite
        run: python3 test/suite.py

  publish:
    name: Build and push the image
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Work out the tags to publish
        id: tags
        env:
          REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
        run: |
          version="${GITHUB_REF#refs/tags/}"
          tags="${REPOSITORY}:${version}"

          # Only plain x.y.z tags take part in the comparison: a release
          # candidate or a name like legacy-1.1.0 would win a textual sort and
          # either steal "latest" or keep it from ever moving.
          newest=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort --version-sort | tail -1)

          # "latest" only follows the highest version: re-tagging an old
          # release must not send yesterday's code to the nightly job.
          if [ -n "$newest" ] && [ "$version" = "$newest" ]; then
            tags="${tags},${REPOSITORY}:latest"
          else
            echo "::notice::${version} is not the highest tag (${newest}), latest is left untouched"
          fi

          echo "list=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
